<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // SPA redirect for GitHub Pages / static hosts
      // Redirects 404s back to index.html so the client-side app can handle routing
      window.location.replace(window.location.origin + '/#' + window.location.pathname);
    </script>
  </head>
  <body></body>
</html>
